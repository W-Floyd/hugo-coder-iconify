{{- /* Math is rendered to MathML at build time (_markup/render-passthrough.html),
       so no KaTeX ships. Only pages with math get this rule: block equations
       scroll instead of overflowing on mobile. */ -}}
{{- if .Store.Get "hasMath" -}}
<style>math[display="block"]{display:block;overflow-x:auto;max-width:100%;margin:.6em 0}</style>
{{- end -}}
